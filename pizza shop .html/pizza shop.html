<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to Our Pizza Shop!</h1>
    </header>
    
    <main>
        <form id="pizza-order-form">
            <fieldset>
                <legend>Order Your Pizza</legend>
                
                <label for="number">How many pizzas?</label>
                <input type="number" id="number" name="number" min="1" max="10" required>
                
                <label for="size">Choose a size:</label>
                <select id="size" name="size" required>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>
                
                <fieldset>
                    <legend>Choose your toppings:</legend>
                    <label><input type="checkbox" name="toppings" value="pepperoni"> Pepperoni</label>
                    <label><input type="checkbox" name="toppings" value="mushrooms"> Mushrooms</label>
                    <label><input type="checkbox" name="toppings" value="onions"> Onions</label>
                    <label><input type="checkbox" name="toppings" value="sausage"> Sausage</label>
                    <label><input type="checkbox" name="toppings" value="bacon"> Bacon</label>
                </fieldset>
                
                <label for="email">Your email:</label>
                <input type="email" id="email" name="email" required>
                
                <button type="submit">Order Pizza</button>
            </fieldset>
        </form>
        
        <section id="order-confirmation" style="display: none;">
            <h2>Order Confirmation</h2>
            <p id="confirmation-details"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
